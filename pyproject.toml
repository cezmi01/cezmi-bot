[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mev-bot"
version = "0.1.0"
description = "ERC-20 MEV arbitrage research bot"
authors = [{ name = "Cezmi", email = "cezmi@example.com" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "web3>=6.15.1",
  "pydantic>=2.6",
  "pydantic-settings>=2.5",
  "rich>=13.7",
  "httpx>=0.27",
  "aiohttp>=3.9",
  "eth-account>=0.10",
  "python-dotenv>=1.0",
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.3",
  "joblib>=1.4",
  "async-timeout>=4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "mypy>=1.11",
]
